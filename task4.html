<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4: CSS Table and Form</title>
    <link rel="stylesheet" href="task4-styles.css">
</head>
<body>

    <h1 id="table-heading">Student Grades Report</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Bakdaulet Begaliev</td>
                <td>Operating Systems</td>
                <td>95%</td>
                <td rowspan="2">Passed</td>
            </tr>
            <tr class="highlight-row">
                <td>Lionel Messi</td>
                <td>Web Development</td>
                <td>100%</td>
            </tr>
            <tr>
                <td>John Doe</td>
                <td>Database Systems</td>
                <td>88%</td>
                <td>Passed</td>
            </tr>
            <tr>
                <td>Alex Smith</td>
                <td>Computer Networks</td>
                <td>72%</td>
                <td>Passed</td>
            </tr>
            <tr>
                <td colspan="3">Class Average Grade</td>
                <td>88.75%</td>
            </tr>
        </tbody>
    </table>

    <div class="form-container">
        <form id="feedback-form">
            <h2>Course Feedback Form</h2>

            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="role">Role:</label>
                <select id="role" name="role">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Would you recommend this course?</label>
                <div class="radio-group">
                    <input type="radio" id="yes" name="recommend" value="yes" checked>
                    <label for="yes" class="radio-label">Yes</label>
                    <input type="radio" id="no" name="recommend" value="no">
                    <label for="no" class="radio-label">No</label>
                </div>
            </div>

            <div class="form-group">
                <label for="comments">Comments:</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Your feedback..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

</body>
</html>
